[package]
name = "canonical-heuristics"
version.workspace = true
edition.workspace = true
build = "build.rs"

[[bin]]
name = "heuristics-parity"
path = "src/bin/heuristics-parity.rs"

[[bin]]
name = "heuristics-bench"
path = "src/bin/heuristics-bench.rs"

[[bin]]
name = "heuristics-search"
path = "src/bin/heuristics-search.rs"

[dependencies]
canonical-core = { path = "../canonical-core" }
canonical-compat = { path = "../canonical-compat" }
tch = { version = "0.22.0", optional = true }
burn = { version = "0.21.0", default-features = false, features = ["std", "ndarray", "store"] }
burn-store = "0.21.0"
# Only for enable_cubecl_disk_cache() (see model.rs): lets us turn on CubeCL's
# persistent compiled-kernel cache in code, so it works regardless of the caller's
# CWD (canonical-lean gets embedded in arbitrary Lean projects, not just this repo).
cubecl-runtime = { version = "0.10", optional = true, default-features = false, features = ["std"] }
safetensors = "=0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.20"

[build-dependencies]
burn-onnx = "0.21.0"

[features]
default = []
tch = ["dep:tch"]
# No fusion/autotune: both JIT-compile a kernel per distinct input shape (multi-second
# on first use of each shape), which never pays off here since every proof search calls
# the model exactly once, usually at a shape that's never been seen before. See README.
cuda = ["burn/cuda", "dep:cubecl-runtime"]
# Opt-in for workloads that repeatedly hit the same few shapes (e.g. a fixed-batch
# training/eval loop), where fusion+autotune's amortized cost actually helps.
cuda-fusion = ["cuda", "burn/fusion", "burn/autotune"]
